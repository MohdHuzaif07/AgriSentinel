<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Dark Sentinel Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#0a1120" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Sentinel Radar / Signal Arcs -->
  <path d="M 44 18 A 20 20 0 0 1 49 34" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
  <path d="M 48 12 A 28 28 0 0 1 54 32" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="0.65" />

  <!-- Stylized AgriSentinel Leaf Shape -->
  <path d="M 18 46 C 18 46, 17 31, 30 20 C 43 9, 47 11, 47 11 C 47 11, 49 25, 36 36 C 24 47, 18 46, 18 46 Z" fill="url(#leafGrad)" />

  <!-- Leaf Central Spine -->
  <path d="M 18 46 C 24 37, 33 28, 47 11" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.95" />

  <!-- Leaf Side Veins -->
  <path d="M 28 35 C 33 34, 38 31, 41 27" fill="none" stroke="#d1fae5" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M 24 40 C 27 38, 30 36, 32 33" fill="none" stroke="#d1fae5" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Sentinel Apex Node -->
  <circle cx="47" cy="11" r="3.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
</svg>